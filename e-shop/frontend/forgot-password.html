<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · E-Shop</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page">

    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">E-Shop</a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-ghost">← Back to shop</a>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h2>Forgot Password?</h2>
            <p class="auth-sub">Enter your email and our support team will help you reset your password.</p>

            <div id="forgotAlert" class="alert" role="alert" hidden></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Request Reset</button>
            </form>

            <p class="auth-footer">
                Remembered it? <a href="index.html#login">Back to Login</a>
            </p>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
        // The backend has no password-reset endpoint yet, so the request goes to support by email.
        const form = document.getElementById('forgotForm');
        const alertBox = document.getElementById('forgotAlert');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = form.email.value.trim();
            if (!EMAIL_REGEX.test(email)) return showAlert(alertBox, 'Please enter a valid email address.');

            const subject = encodeURIComponent('Password reset request');
            const body = encodeURIComponent(`Please help me reset the password for my account: ${email}`);
            location.href = `mailto:support@eshop.com?subject=${subject}&body=${body}`;
            showAlert(alertBox, 'Your email app has been opened. Send the message and our team will contact you shortly.', 'info');
        });
    </script>
</body>

</html>
